name = "sharpy-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# `wrangler d1 create sharpy` prints the id to paste here.
[[d1_databases]]
binding = "DB"
database_name = "sharpy"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Hourly: build today's Discover feed if missing, then top up quiz banks that ran low.
[triggers]
crons = ["17 * * * *"]

[[ratelimits]]
name = "BURST"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
MODEL = "claude-opus-5-5"
# Every generation is a paid Claude call. Past these caps the app serves cached content only.
DAILY_GENERATION_CAP = "40"
PER_INSTALL_DAILY_GENERATIONS = "6"

[observability]
enabled = true
