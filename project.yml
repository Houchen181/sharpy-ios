# XcodeGen spec — the .xcodeproj is generated from this (CI runs `xcodegen generate`).
name: Sharpy
options:
  bundleIdPrefix: com.houchenli
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The Cloudflare Worker in server/ that holds the Claude key.
    SHARPY_API_BASE_URL: https://sharpy-api.charges-ios.workers.dev
targets:
  Sharpy:
    type: application
    platform: iOS
    sources:
      - path: Sharpy
    # CI writes Config/Signing.generated.xcconfig (team, cert, profile) before
    # archiving; locally the include is optional and Xcode signs automatically.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houchenli.sharpy
        PRODUCT_NAME: Sharpy
        INFOPLIST_FILE: Sharpy/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # XcodeGen's iOS preset hard-codes "iPhone Developer" at target level,
        # which outranks xcconfig files; route it through a variable instead.
        CODE_SIGN_IDENTITY: $(SHARPY_CODE_SIGN_IDENTITY)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
  # Drives the scripted tour that CI records for the intro video.
  SharpyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SharpyUITests
    dependencies:
      - target: Sharpy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.houchenli.sharpy.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Sharpy
schemes:
  Sharpy:
    build:
      targets:
        Sharpy: all
        SharpyUITests: [test]
    test:
      targets:
        - SharpyUITests
    run:
      config: Debug
    archive:
      config: Release
